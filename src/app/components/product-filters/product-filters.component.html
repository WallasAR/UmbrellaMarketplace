<div class="flex flex-col w-full bg-white md:bg-transparent">
  
  <h3 class="text-xl font-extrabold text-gray-900 mb-6 hidden md:block">Filtros</h3>

  <!-- Ofertas / Perto de Mim -->
  <div class="mb-8 space-y-4">
    <!-- Perto de mim -->
    <label class="flex items-center gap-3 text-sm text-gray-700 cursor-pointer hover:text-gray-900 transition-colors p-3 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
      <input type="checkbox" class="w-5 h-5 rounded text-brand focus:ring-brand border-gray-300" [checked]="nearbyEnabled" (change)="toggleNearby($any($event.target).checked)" [disabled]="geoLoading" />
      <span class="flex items-center gap-2 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-emerald-500">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
        </svg>
        Perto de mim
      </span>
      @if (geoLoading) {
        <span class="text-xs text-gray-400 ml-auto">Buscando...</span>
      }
    </label>
    @if (geoError) {
      <p class="text-xs text-red-500 pl-2">{{ geoError }}</p>
    }

    <!-- Ofertas -->
    <label class="flex items-center gap-3 text-sm text-gray-700 cursor-pointer hover:text-gray-900 transition-colors p-3 bg-rose-50 rounded-xl border border-rose-100 shadow-sm">
      <input type="checkbox" class="w-5 h-5 rounded text-rose-500 focus:ring-rose-500 border-rose-300" [checked]="filters.discount" (change)="toggleDiscount()" />
      <span class="flex items-center gap-2 font-bold text-rose-700">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M11.986 3H12a2 2 0 012 2v6a2 2 0 01-1.5 1.937V7A2.5 2.5 0 0010 4.5H4.063A2 2 0 016 3h5.986zm-6 2A1.5 1.5 0 004.5 6.5v8A1.5 1.5 0 006 16h6a1.5 1.5 0 001.5-1.5v-8A1.5 1.5 0 0012 5H6z" clip-rule="evenodd" />
        </svg>
        Em Promoção
      </span>
    </label>
  </div>

  <hr class="border-gray-200 mb-6" />

  <!-- Categorias -->
  <div class="mb-8">
    <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4">Categorias</h4>
    <div class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-2 custom-scrollbar">
      @for (cat of categories; track cat) {
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" 
            class="w-4 h-4 rounded text-brand focus:ring-brand border-gray-300"
            [checked]="filters.category === cat"
            (change)="toggleCategory(cat)">
          <span class="text-sm text-gray-600 group-hover:text-gray-900 transition-colors" [class.font-bold]="filters.category === cat" [class.text-brand]="filters.category === cat">{{ cat }}</span>
        </label>
      }
    </div>
  </div>

  <hr class="border-gray-200 mb-6" />

  <!-- Sintomas (Para Você) -->
  <div class="mb-8">
    <h4 class="text-sm font-bold text-gray-900 uppercase tracking-wider mb-4">Sintomas comuns</h4>
    <div class="flex flex-col gap-2">
      @for (symp of commonSymptoms; track symp) {
        <label class="flex items-center gap-3 cursor-pointer group">
          <input type="checkbox" 
            class="w-4 h-4 rounded text-blue-600 focus:ring-blue-600 border-gray-300"
            [checked]="filters.symptom === symp"
            (change)="toggleSymptom(symp)">
          <span class="text-sm text-gray-600 group-hover:text-gray-900 transition-colors" [class.font-bold]="filters.symptom === symp" [class.text-blue-700]="filters.symptom === symp">{{ symp }}</span>
        </label>
      }
    </div>
  </div>

</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: #f1f1f1; 
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #d1d5db; 
    border-radius: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #9ca3af; 
  }
</style>
