<div class="relative w-full h-full flex items-center" (click)="$event.stopPropagation()">
  
  <!-- Search Input Container -->
  <div class="flex-1 relative flex items-center bg-gray-50 rounded-full border border-gray-200 focus-within:ring-1 focus-within:ring-brand/30 transition-all overflow-visible">
    

    <input 
      #searchInput
      type="text" 
      [value]="searchQuery"
      (input)="onInput($event)"
      (keydown.enter)="search(searchQuery)"
      (focus)="onFocus()"
      placeholder="Busque por medicamento, princípio ativo, laboratório..." 
      class="flex-1 bg-transparent border-none px-4 py-2.5 focus:outline-none text-sm text-gray-800 placeholder-gray-400"
    />
    
    <button *ngIf="searchQuery" (click)="reset(); searchInput.value=''" class="absolute right-12 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <button type="button" (click)="search(searchQuery)" class="p-2.5 mr-1 rounded-full text-gray-500 hover:bg-gray-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" /></svg>
    </button>
  </div>

  <!-- Modal/Dropdown Content -->
  <div *ngIf="isOpen" class="absolute top-full left-0 w-full mt-2 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden max-h-[80vh] flex flex-col z-50 animate-scale-in">

    <!-- Modal Body -->
    <div class="flex-1 overflow-y-auto bg-white">
      
      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="p-8 flex justify-center">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-brand"></div>
      </div>

      <div class="p-4 md:p-6" *ngIf="!isLoading">
        
        <!-- Default State: No query -->
        <div *ngIf="searchQuery.length < 3">

          <!-- Popular Categories (Drogasil Style) -->
          <div *ngIf="popularCategories.length === 0 && history.length === 0" class="text-center py-8">
            <svg class="w-12 h-12 text-gray-200 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <p class="text-gray-500 font-medium">Nenhuma busca recente.</p>
            <p class="text-gray-400 text-sm mt-1">Comece a digitar para ver sugestões de produtos.</p>
          </div>

          <div *ngIf="popularCategories.length > 0" class="mb-8">
            <h4 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Principais Categorias</h4>
            <div class="flex flex-wrap gap-2">
              <button *ngFor="let cat of popularCategories" (click)="searchByCategory(cat)" class="px-5 py-2.5 bg-gray-50 hover:bg-gray-100 hover:text-brand rounded-full text-sm font-medium text-gray-700 transition-colors border border-gray-100">
                {{ cat }}
              </button>
            </div>
          </div>

          <!-- History -->
          <div *ngIf="history.length > 0" class="mb-8">
            <div class="flex items-center justify-between mb-3">
              <h4 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Buscas Recentes</h4>
            </div>
            <div class="flex flex-wrap gap-2">
              <button *ngFor="let h of history" (click)="search(h)" class="px-4 py-2 bg-white hover:bg-gray-50 rounded-full text-sm text-gray-600 transition-colors flex items-center border border-gray-200">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {{ h }}
              </button>
            </div>
          </div>
        </div>

        <!-- Active Search State -->
        <div *ngIf="searchQuery.length >= 3">
          
          <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Left Column: Suggestions (Terms, Categories, Brands) -->
            <div class="md:col-span-1 space-y-6">
              
              <div *ngIf="suggestions.terms.length > 0">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Termos Sugeridos</h4>
                <ul class="space-y-1">
                  <li *ngFor="let term of suggestions.terms">
                    <button (click)="search(term)" class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:text-brand hover:bg-red-50 rounded-lg transition-colors flex items-center">
                      <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                      <span><span class="font-bold text-gray-900">{{ searchQuery.toLowerCase() }}</span>{{ term.toLowerCase().substring(searchQuery.length) || term.toLowerCase() }}</span>
                    </button>
                  </li>
                </ul>
              </div>

              <div *ngIf="suggestions.categories && suggestions.categories.length > 0">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Categorias</h4>
                <ul class="space-y-1">
                  <li *ngFor="let cat of suggestions.categories">
                    <button (click)="searchByCategory(cat)" class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors font-medium">
                      {{ cat }}
                    </button>
                  </li>
                </ul>
              </div>

              <div *ngIf="suggestions.brands && suggestions.brands.length > 0">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Marcas Sugeridas</h4>
                <ul class="space-y-1">
                  <li *ngFor="let brand of suggestions.brands">
                    <button (click)="searchByBrand(brand)" class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors font-medium">
                      {{ brand }}
                    </button>
                  </li>
                </ul>
              </div>
              
              <div *ngIf="suggestions.terms.length === 0 && (!suggestions.categories || suggestions.categories.length === 0) && (!suggestions.brands || suggestions.brands.length === 0)">
                 <p class="text-sm text-gray-500 italic">Sem termos sugeridos...</p>
              </div>

            </div>

            <!-- Right Column: Suggested Products -->
            <div class="md:col-span-3">
              <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
                <h4 class="text-sm font-bold text-gray-800">Produtos Sugeridos</h4>
                <button (click)="search(searchQuery)" class="text-sm text-brand font-bold hover:underline flex items-center">
                  Ver todos <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              </div>

              <div *ngIf="!suggestions.products || suggestions.products.length === 0" class="text-gray-500 text-sm py-4 flex flex-col items-center justify-center bg-gray-50 rounded-xl h-32 border border-dashed border-gray-200">
                <svg class="w-8 h-8 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Nenhum produto encontrado.
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div *ngFor="let prod of suggestions.products">
                  <!-- Miniature product card -->
                  <a [routerLink]="['/product', prod.id]" (click)="closeModal()" class="flex items-center p-3 rounded-xl border border-gray-100 hover:border-brand hover:shadow-[0_4px_12px_rgba(247,72,56,0.1)] transition-all group bg-white">
                    <div class="w-16 h-16 bg-white border border-gray-100 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center p-1">
                      <img *ngIf="prod.Images?.[0]?.thumb_img" [src]="prod.Images[0].thumb_img" class="max-w-full max-h-full object-contain" />
                      <div *ngIf="!prod.Images?.[0]?.thumb_img" class="w-8 h-8 bg-gray-100 rounded-full"></div>
                    </div>
                    <div class="ml-3 flex-1 min-w-0">
                      <h5 class="text-sm font-semibold text-gray-800 line-clamp-2 leading-tight group-hover:text-brand transition-colors">{{ prod.name }}</h5>
                      <div class="flex items-center mt-1">
                        <span class="font-extrabold text-brand">R$ {{ prod.price | number:'1.2-2' }}</span>
                      </div>
                    </div>
                  </a>
                </div>
              </div>

            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
