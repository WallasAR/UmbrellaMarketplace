<nav *ngIf="cfg.visible" class="sticky top-0 z-50 w-full bg-white border-b border-gray-100 pb-2" aria-label="Navegação principal" [class.pointer-events-none]="previewMode">
  <div class="px-4 sm:px-6 flex items-center justify-between h-20 w-full max-w-7xl mx-auto gap-4">
    <a [routerLink]="cfg.logo_link || '/home'" class="flex shrink-0 items-center mr-2 md:mr-6" [attr.aria-label]="cfg.logo_alt">
      <img class="h-8 md:h-10 hover:animate-squash transition-transform" [src]="cfg.logo_url | assetUrl" [alt]="cfg.logo_alt">
    </a>

    <div *ngIf="cfg.show_search" class="hidden md:flex flex-1 max-w-3xl items-center relative z-40">
      <!-- Search Component (Dropdown) -->
      <app-search-modal class="w-full flex-1 h-12"></app-search-modal>

      <!-- Compra Rápida com Receita Shortcut -->
      <a routerLink="/prescription" class="hidden xl:flex items-center gap-3 ml-4 pl-4 border-l border-gray-200 hover:opacity-80 transition-opacity shrink-0 cursor-pointer">
        <div class="text-brand">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] text-gray-500 font-medium leading-none">Compra rápida</span>
          <span class="text-xs font-bold text-gray-900 leading-none mt-1">com receita</span>
        </div>
      </a>
    </div>

    <div class="flex items-center gap-2 md:gap-4 ml-auto">
      <div *ngIf="cfg.show_location" class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-gray-50 cursor-pointer transition">
        <div class="w-8 h-8 rounded-full flex items-center justify-center" [style.background-color]="accentColor + '15'" [style.color]="accentColor">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[10px] text-gray-500 uppercase tracking-wide">{{ cfg.location_label }}</span>
          <span class="text-xs font-bold text-gray-800 flex items-center gap-1">{{ cfg.location_value }}</span>
        </div>
      </div>

      <div *ngIf="cfg.show_cart" class="relative">
        <button type="button" (click)="goToCart()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 transition-colors" [style.--hover-bg]="accentColor + '15'" aria-label="Carrinho">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          @if (!previewMode && cartService.itemCount() > 0) {
            <span class="absolute -top-1 -right-1 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 border-2 border-white shadow-sm" [style.background-color]="accentColor">{{ cartService.itemCount() }}</span>
          }
        </button>
      </div>

      <div *ngIf="cfg.show_profile" class="relative hidden sm:block">
        <button type="button" class="flex items-center gap-2 rounded-full border border-gray-100 p-1 pr-3 hover:bg-gray-50 transition-colors" (click)="toggleDropdown('profile')">
          <div class="w-8 h-8 rounded-full text-white flex items-center justify-center font-bold text-sm shrink-0 overflow-hidden" [style.background-color]="accentColor">
            {{ authService.isAuthenticated() ? 'U' : '?' }}
          </div>
          <div class="flex flex-col text-left">
            <span class="text-[10px] text-gray-500 leading-none">Olá, {{ authService.isAuthenticated() ? 'Usuário' : 'Visitante' }}!</span>
            <span class="text-xs font-bold text-gray-800 leading-none mt-1">{{ authService.isAuthenticated() ? 'Minha Conta' : 'Entrar' }}</span>
          </div>
        </button>

        <div *ngIf="dropdownOpen === 'profile'" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50">
          <ng-container *ngIf="authService.isAuthenticated(); else guestMenu">
            <a routerLink="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="closeDropdowns()">Minha Conta</a>
            <a routerLink="/orders" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="closeDropdowns()">Meus Pedidos</a>
            <a routerLink="/favoritos" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="closeDropdowns()">Favoritos</a>
            <hr class="my-1 border-gray-100">
            <button type="button" (click)="logout()" class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">Sair</button>
          </ng-container>
          <ng-template #guestMenu>
            <a routerLink="/auth" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors" (click)="closeDropdowns()">Entrar / Cadastrar</a>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="cfg.show_search" class="md:hidden px-4 pb-3 relative z-40">
    <app-search-modal class="w-full h-10 block"></app-search-modal>
  </div>

  <div *ngIf="cfg.show_category_bar && visibleCategoryLinks().length" class="hidden md:flex w-full max-w-7xl mx-auto px-4 sm:px-6 items-center gap-2 overflow-x-auto no-scrollbar pb-1">
    <a
      *ngFor="let link of visibleCategoryLinks()"
      [routerLink]="link.link_url"
      [ngClass]="linkClasses(link)"
      [ngStyle]="linkStyle(link)"
    >{{ link.label }}</a>
  </div>
</nav>
